name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tokenledger
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tokenledger_test
      API_KEY: ci-test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check linting with ruff
        run: uv run ruff check .

      - name: Check code formatting with ruff
        run: uv run ruff format --check .

      - name: Run test suite with coverage gate
        run: uv run pytest --cov=app --cov=sdk --cov-fail-under=80
